    g2.position.set(71, 1.25, 59); g2.rotation.y = -Math.atan2(0.561, -0.828); g2.traverse(m => { m.castShadow = true; }); scene.add(g2); }
  // columns
  COLS.forEach(c => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, HI, 16), M.col); m.position.set(c[0], HI / 2, c[1]); m.castShadow = true; scene.add(m); });
  // wheelchair spaces
  wc.forEach(w => { const wd = 2 * CW + 0.08; const ctr = toW(w.X + wd / 2, w.Y); const m = new THREE.Mesh(new THREE.BoxGeometry(wd, 0.06, CD), M.wc); m.position.set(ctr[0], 0.06, ctr[1]); m.rotation.y = -Math.atan2(-D[1], -D[0]); scene.add(m); });
  // chairs (instanced): seat, back, two side legs; chair faces +Z in its own frame
  const all = [];
  hallSeats.forEach(c => { const ctr = toW(c.X + CW / 2, c.Y); all.push({ x: ctr[0], z: ctr[1], fx: Nn[0], fz: Nn[1], sx: CW / 1.6, sz: CD / 1.5 }); });
  classChairs.forEach(c => all.push({ x: c.c[0], z: c.c[1], fx: c.fx, fz: c.fz, sx: c.cw / 1.6, sz: c.cd / 1.5 }));
  const parts = [
    [new THREE.BoxGeometry(1.5, 0.14, 1.45), M.chair, new THREE.Vector3(0, 1.5, 0)],
    [new THREE.BoxGeometry(1.5, 1.35, 0.12), M.chair, new THREE.Vector3(0, 2.25, -0.66)],
    [new THREE.BoxGeometry(0.08, 1.45, 1.3), M.chairDark, new THREE.Vector3(-0.66, 0.73, 0)],
    [new THREE.BoxGeometry(0.08, 1.45, 1.3), M.chairDark, new THREE.Vector3(0.66, 0.73, 0)]
  ];
  const tmp = new THREE.Matrix4(), rot = new THREE.Matrix4(), tr = new THREE.Matrix4(), off = new THREE.Matrix4();
  parts.forEach(([geo, mat, o]) => { const im = new THREE.InstancedMesh(geo, mat, all.length); im.castShadow = true; im.receiveShadow = true;
    const scl = new THREE.Matrix4();
    all.forEach((c, i) => { const th = Math.atan2(c.fx, c.fz); rot.makeRotationY(th); tr.makeTranslation(c.x, 0, c.z); scl.makeScale(c.sx || 1, 1, c.sz || 1); off.makeTranslation(o.x, o.y, o.z); tmp.copy(tr).multiply(rot).multiply(scl).multiply(off); im.setMatrixAt(i, tmp); });
    im.instanceMatrix.needsUpdate = true; scene.add(im); });
  // labels as sprites
  function label(txt, x, z, y, scale) { const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128; const cx = cv.getContext('2d'); cx.fillStyle = 'rgba(15,20,25,0.72)'; cx.fillRect(0, 0, 512, 128); cx.font = '600 54px Archivo, Arial, sans-serif'; cx.fillStyle = '#F3F6F8'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(txt, 256, 64);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false })); sp.position.set(x, y || 11, z); const s = scale || 1; sp.scale.set(14 * s, 3.5 * s, 1); scene.add(sp); return sp; }
  label('PLATFORM', 64, 61, 6); label('NURSERY', 57.5, 16); label('SOUND BOOTH', toW(-1.5, 7.75)[0], toW(-1.5, 7.75)[1], 7, 0.6); label('CLASSROOM 1', 12.6, 56); label('CLASSROOM 2', 29, 29); label('CLASSROOM 3', 50, 74); label('LOBBY', 12, 73); label('HALLWAY', 23, 59, 10, 0.7);
  label("WOMEN'S", 84.5, 30, 10, 0.8); label("MEN'S", 84.5, 40.5, 10, 0.8); label('KITCHENETTE', 75, 15, 10, 0.75); label('MAIN ENTRY', 4, 74, 7, 0.8); label('STORAGE / OFFICE', 76.5, 65, 10, 0.7); label('STORAGE ENTRY', 75, 76, 10, 0.7); label("PASTOR'S OFFICE", 11, 41, 10, 0.75); label('PIANO', 71, 59, 7, 0.6);

  document.getElementById('count').textContent = `${hallSeats.length} chairs + ${wc.length} wheelchair spaces in the hall · ${classSeats} classroom seats`;

  // ---------- camera control ----------
  const target = new THREE.Vector3(47, 2, 45);
  let theta = -0.9, phi = 0.95, dist = 125;
  function apply() { camera.position.set(target.x + dist * Math.sin(phi) * Math.sin(theta), target.y + dist * Math.cos(phi), target.z + dist * Math.sin(phi) * Math.cos(theta)); camera.lookAt(target); }
  const presets = {
    vOver: { t: [47, 2, 45], th: -0.9, ph: 0.95, d: 125 },
    vBack: { t: [60, 3, 56], th: Math.atan2(38 - 60, 32 - 56), ph: 1.45, d: 36 },
    vPlat: { t: [40, 2.5, 40], th: Math.atan2(64 - 40, 58 - 40), ph: 1.45, d: 30 },
    vDoor: { t: [26, 4, 55], th: Math.atan2(8 - 26, 74 - 55), ph: 1.5, d: 26 },
    vNurs: { t: [70, 3, 24], th: Math.atan2(76 - 70, 12 - 24), ph: 1.3, d: 22 }
  };
  function go(id) { const p = presets[id]; target.set(p.t[0], p.t[1], p.t[2]); theta = p.th; phi = p.ph; dist = p.d; apply(); document.querySelectorAll('.bar button[id^="v"]').forEach(b => b.classList.toggle('on', b.id === id)); }
  Object.keys(presets).forEach(id => document.getElementById(id).addEventListener('click', () => go(id)));
  let lowered = false;
  document.getElementById('tWalls').addEventListener('click', (e) => { lowered = !lowered; walls.scale.y = lowered ? 0.35 : 1; e.target.textContent = lowered ? 'Full-height walls' : 'Lower walls'; e.target.classList.toggle('on', lowered); });
  const el = renderer.domElement;
  let drag = null;
  el.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button, shift: e.shiftKey }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.b === 2 || drag.shift) { const right = new THREE.Vector3(Math.cos(theta), 0, -Math.sin(theta)); const fwd = new THREE.Vector3(-Math.sin(theta), 0, -Math.cos(theta)); target.addScaledVector(right, -dx * dist * 0.0012); target.addScaledVector(fwd, -dy * dist * 0.0012); }
    else { theta -= dx * 0.006; phi = Math.min(1.52, Math.max(0.15, phi - dy * 0.006)); }
    apply(); });
  el.addEventListener('pointerup', () => { drag = null; });
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('wheel', (e) => { e.preventDefault(); dist = Math.min(300, Math.max(8, dist * (1 + e.deltaY * 0.0012))); apply(); }, { passive: false });
  let pinch = null;
  el.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
  el.addEventListener('touchmove', (e) => { if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); dist = Math.min(300, Math.max(8, dist * pinch / d)); pinch = d; apply(); } }, { passive: true });
  function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize);
  resize(); apply();
  const h0 = (location.hash || '').replace('#', ''); if (presets[h0]) go(h0);
  (function loop() { renderer.render(scene, camera); requestAnimationFrame(loop); })();
})();
</script>
